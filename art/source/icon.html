<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Lilita"; src: url("lilita.ttf"); }
html, body { margin: 0; padding: 0; background: #000; }
svg { display: block; }
</style></head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#8fe6ff"/>
      <stop offset="0.45" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#2236b8"/>
    </radialGradient>
    <linearGradient id="diceFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#c9d8ff"/>
    </linearGradient>
    <linearGradient id="diceSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9bdf2"/>
      <stop offset="1" stop-color="#7d95d8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5b8a"/>
      <stop offset="0.2" stop-color="#ffb13b"/>
      <stop offset="0.4" stop-color="#fff35c"/>
      <stop offset="0.6" stop-color="#5cff9d"/>
      <stop offset="0.8" stop-color="#4fd6ff"/>
      <stop offset="1" stop-color="#b56bff"/>
    </linearGradient>
    <radialGradient id="cat" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffc77a"/>
      <stop offset="1" stop-color="#ff9030"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a9cff"/><stop offset="1" stop-color="#2f62e0"/></linearGradient>
    <radialGradient id="skin" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff0a0"/><stop offset="0.5" stop-color="#ffd23f"/><stop offset="1" stop-color="#e0a812"/></radialGradient>
    <radialGradient id="hair" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#c47a40"/><stop offset="0.5" stop-color="#9a5a2c"/><stop offset="1" stop-color="#6a3818"/></radialGradient>
    <radialGradient id="bokeh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="round"><rect width="512" height="512" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- background and sunburst -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <g transform="translate(256 250)" opacity="0.16" fill="#ffffff">
      <g id="rays">
        <polygon points="0,0 -26,-420 26,-420"/>
      </g>
      <use href="#rays" transform="rotate(22.5)"/><use href="#rays" transform="rotate(45)"/><use href="#rays" transform="rotate(67.5)"/>
      <use href="#rays" transform="rotate(90)"/><use href="#rays" transform="rotate(112.5)"/><use href="#rays" transform="rotate(135)"/>
      <use href="#rays" transform="rotate(157.5)"/><use href="#rays" transform="rotate(180)"/><use href="#rays" transform="rotate(202.5)"/>
      <use href="#rays" transform="rotate(225)"/><use href="#rays" transform="rotate(247.5)"/><use href="#rays" transform="rotate(270)"/>
      <use href="#rays" transform="rotate(292.5)"/><use href="#rays" transform="rotate(315)"/><use href="#rays" transform="rotate(337.5)"/>
    </g>
    <circle cx="256" cy="260" r="170" fill="#bff3ff" opacity="0.35" filter="url(#soft)"/>
    <circle cx="70" cy="250" r="34" fill="url(#bokeh)"/><circle cx="455" cy="270" r="26" fill="url(#bokeh)"/><circle cx="120" cy="470" r="40" fill="url(#bokeh)"/><circle cx="420" cy="470" r="30" fill="url(#bokeh)"/><circle cx="300" cy="40" r="24" fill="url(#bokeh)"/>

    <!-- sparkles -->
    <g fill="#fff8c4">
      <path id="spark" d="M0,-16 C2,-4 4,-2 16,0 C4,2 2,4 0,16 C-2,4 -4,2 -16,0 C-4,-2 -2,-4 0,-16Z"/>
    </g>
    <use href="#spark" transform="translate(86 120) scale(1.2)" fill="#fff8c4"/>
    <use href="#spark" transform="translate(440 150) scale(0.9)" fill="#ffffff"/>
    <use href="#spark" transform="translate(70 380) scale(0.8)" fill="#ffffff"/>
    <use href="#spark" transform="translate(452 400) scale(1.3)" fill="#fff8c4"/>
    <use href="#spark" transform="translate(400 70) scale(0.7)" fill="#ffffff"/>

    <!-- the luck ring, back half -->
    <g transform="rotate(-12 256 412)" filter="url(#glow)">
      <path d="M 76 412 A 180 46 0 0 1 436 412" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    </g>

    <!-- the dice buddy -->
    <g transform="translate(256 286)">
      <!-- shadow -->
      <ellipse cx="0" cy="168" rx="120" ry="18" fill="#10196b" opacity="0.35"/>
      <!-- legs -->
      <rect x="-70" y="112" width="44" height="52" rx="18" fill="#eaf1ff" stroke="#1d2140" stroke-width="9"/>
      <rect x="26" y="112" width="44" height="52" rx="18" fill="#eaf1ff" stroke="#1d2140" stroke-width="9"/>
      <!-- side of the cube (3D) -->
      <path d="M -112,-118 L -88,-140 L 140,-140 Q 152,-140 152,-128 L 152,96 L 128,120 Z" fill="url(#diceSide)" stroke="#1d2140" stroke-width="10" stroke-linejoin="round"/>
      <!-- front face -->
      <rect x="-128" y="-124" width="256" height="252" rx="58" fill="url(#diceFace)" stroke="#1d2140" stroke-width="11"/>
      <path d="M -96,-104 Q -60,-116 -10,-112" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
      <!-- pips -->
      <circle cx="-80" cy="-78" r="17" fill="#1f2f8a"/><circle cx="-77" cy="-75" r="12" fill="#2c42b8"/><circle cx="-85" cy="-83" r="5" fill="#8fa2ff" opacity="0.9"/>
      <circle cx="80" cy="-78" r="17" fill="#1f2f8a"/><circle cx="83" cy="-75" r="12" fill="#2c42b8"/><circle cx="75" cy="-83" r="5" fill="#8fa2ff" opacity="0.9"/>
      <circle cx="-80" cy="84" r="17" fill="#1f2f8a"/><circle cx="-77" cy="87" r="12" fill="#2c42b8"/><circle cx="-85" cy="79" r="5" fill="#8fa2ff" opacity="0.9"/>
      <circle cx="80" cy="84" r="17" fill="#1f2f8a"/><circle cx="83" cy="87" r="12" fill="#2c42b8"/><circle cx="75" cy="79" r="5" fill="#8fa2ff" opacity="0.9"/>
      
      <!-- face -->
      <ellipse cx="-42" cy="-6" rx="30" ry="38" fill="#1d2140"/>
      <ellipse cx="42" cy="-6" rx="30" ry="38" fill="#1d2140"/>
      <ellipse cx="-42" cy="4" rx="22" ry="26" fill="#3a63ff"/>
      <ellipse cx="42" cy="4" rx="22" ry="26" fill="#3a63ff"/>
      <circle cx="-52" cy="-20" r="11" fill="#ffffff"/>
      <circle cx="32" cy="-20" r="11" fill="#ffffff"/>
      <circle cx="-32" cy="10" r="5" fill="#ffffff"/><circle cx="-46" cy="22" r="3" fill="#bcd0ff"/><circle cx="38" cy="22" r="3" fill="#bcd0ff"/>
      <circle cx="52" cy="10" r="5" fill="#ffffff"/>
      <ellipse cx="-86" cy="34" rx="18" ry="11" fill="#ff8fb0" opacity="0.85"/>
      <ellipse cx="86" cy="34" rx="18" ry="11" fill="#ff8fb0" opacity="0.85"/>
      <path d="M -30,38 Q 0,78 30,38 Z" fill="#7a1d3a" stroke="#1d2140" stroke-width="8" stroke-linejoin="round"/>
      <path d="M -14,56 Q 0,48 14,56 Q 6,68 0,68 Q -6,68 -14,56 Z" fill="#ff6f8f"/>
      <!-- arms: one waving up, one holding -->
      <path d="M -124,10 Q -168,-10 -178,-62" fill="none" stroke="#1d2140" stroke-width="30" stroke-linecap="round"/>
      <path d="M -124,10 Q -168,-10 -178,-62" fill="none" stroke="#eaf1ff" stroke-width="16" stroke-linecap="round"/>
      <circle cx="-180" cy="-74" r="22" fill="#ffffff" stroke="#1d2140" stroke-width="9"/>

    </g>

    <!-- a bacon hair kid popping up beside the dice -->
    <g transform="translate(418 330) rotate(6)">
      <!-- body: blue shirt with a star, a waving arm, green legs -->
      <rect x="-30" y="110" width="28" height="58" rx="8" fill="#3fb34f" stroke="#1d2140" stroke-width="7"/>
      <rect x="2" y="110" width="28" height="58" rx="8" fill="#36a046" stroke="#1d2140" stroke-width="7"/>
      <rect x="-46" y="30" width="92" height="88" rx="12" fill="url(#shirt)" stroke="#1d2140" stroke-width="8"/>
      <path d="M 0,52 L 6,66 L 21,66 L 9,75 L 13,90 L 0,81 L -13,90 L -9,75 L -21,66 L -6,66 Z" fill="#ffd23f" stroke="#1d2140" stroke-width="3.5" stroke-linejoin="round"/>
      <g transform="rotate(-150 40 40)"><rect x="34" y="36" width="28" height="70" rx="10" fill="url(#skin)" stroke="#1d2140" stroke-width="7"/></g>
      <rect x="-70" y="36" width="28" height="64" rx="10" fill="url(#skin)" stroke="#1d2140" stroke-width="7" transform="rotate(18 -56 40)"/>
    </g>
    <g transform="translate(418 262) rotate(6) scale(0.8)">
      <rect x="-58" y="-56" width="116" height="112" rx="20" fill="url(#skin)" stroke="#1d2140" stroke-width="8"/>
      <path d="M -66,8 Q -76,-40 -50,-66 Q -40,-84 -18,-80 Q -4,-96 16,-86 Q 36,-96 52,-80 Q 76,-74 74,-44 Q 80,-20 70,6 Q 62,-14 50,-6 Q 40,-24 22,-16 Q 4,-30 -12,-16 Q -28,-28 -40,-10 Q -54,-18 -66,8 Z" fill="url(#hair)" stroke="#1d2140" stroke-width="7" stroke-linejoin="round"/>
      <path d="M -58,-36 Q -20,-62 30,-58 Q 56,-56 66,-40" stroke="#e7a768" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M -62,-14 Q -20,-40 30,-36 Q 56,-34 70,-18" stroke="#e7a768" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M -50,-50 Q -10,-74 40,-70" stroke="#5e2f14" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M -60,-26 Q -20,-50 34,-46 Q 60,-44 70,-30" stroke="#5e2f14" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
      <ellipse cx="-20" cy="16" rx="9" ry="13" fill="#1d2140"/><ellipse cx="22" cy="16" rx="9" ry="13" fill="#1d2140"/>
      <circle cx="-23" cy="11" r="4" fill="#fff"/><circle cx="19" cy="11" r="4" fill="#fff"/>
      <ellipse cx="-38" cy="34" rx="9" ry="5" fill="#ff8fa0" opacity="0.7"/><ellipse cx="40" cy="34" rx="9" ry="5" fill="#ff8fa0" opacity="0.7"/>
      <path d="M -16,34 Q 2,54 20,34 Z" fill="#7a1d3a" stroke="#1d2140" stroke-width="5" stroke-linejoin="round"/>
      <ellipse cx="-30" cy="-46" rx="14" ry="6" fill="#ffffff" opacity="0.45" transform="rotate(-20 -30 -46)"/>
    </g>
    <!-- the luck ring, front half -->
    <g transform="rotate(-12 256 412)" filter="url(#glow)">
      <path d="M 436 412 A 180 46 0 0 1 76 412" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
    </g>
    <use href="#spark" transform="translate(150 360) scale(0.9)" fill="#ffffff"/><use href="#spark" transform="translate(96 430) scale(0.6)" fill="#fff8c4"/><use href="#spark" transform="translate(430 392) scale(0.55)" fill="#ffffff"/><use href="#spark" transform="translate(250 470) scale(0.5)" fill="#fff8c4"/>
    <use href="#spark" transform="translate(372 260) scale(0.7)" fill="#fff8c4"/>

    <!-- NEW ribbon -->
    <g transform="translate(0 0)">
      <path d="M 0,96 L 96,0 L 170,0 L 0,170 Z" fill="#ff3b3b" stroke="#1d2140" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 0,96 L 96,0 L 104,0 L 0,104 Z" fill="#ff7a7a"/>
      <text x="0" y="0" transform="translate(68 92) rotate(-45)" font-family="Lilita" font-size="46" fill="#ffffff" stroke="#1d2140" stroke-width="8" paint-order="stroke" text-anchor="middle">NEW</text>
    </g>
    <rect width="512" height="512" filter="url(#grain)" opacity="0.09"/>
  </g>
</svg>
</body></html>
